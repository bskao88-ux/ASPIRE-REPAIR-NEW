<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>設施報修系統 · 渴望會館</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="渴望報修">
<meta name="theme-color" content="#E8761A">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background: #FBF8F4; color: #1a1a1a; min-height: 100vh; }

  /* ── Navigation ── */
  .nav {
    background: #E8761A;
    padding: 0; display: flex; align-items: stretch;
    box-shadow: 0 2px 12px rgba(232,118,26,0.25);
    position: sticky; top: 0; z-index: 50;
  }
  .nav-brand { color: white; font-size: 15px; font-weight: 700; padding: 14px 18px; letter-spacing: 0.03em; display: flex; align-items: center; gap: 7px; }
  .nav-tabs { display: flex; margin-left: auto; }
  .nav-tab { color: rgba(255,255,255,0.75); font-size: 13px; padding: 0 14px; display: flex; align-items: center; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; font-weight: 500; }
  .nav-tab:hover { color: white; background: rgba(255,255,255,0.12); }
  .nav-tab.active { color: white; border-bottom-color: white; }
  .logout-btn { font-size: 12px; color: rgba(255,255,255,0.65); cursor: pointer; padding: 0 14px; display: flex; align-items: center; border-left: 1px solid rgba(255,255,255,0.2); }
  .logout-btn:hover { color: white; }

  /* ── Pages ── */
  .page { display: none; padding: 20px 16px; max-width: 700px; margin: 0 auto; }
  .page.active { display: block; }

  /* ── Cards ── */
  .card { background: white; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 16px; }
  .card-header { background: #E8761A; color: white; padding: 13px 18px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 18px; }
  .section-label { font-size: 11px; font-weight: 700; color: #E8761A; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 13px; }
  .field { margin-bottom: 15px; }
  .field label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 13px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; color: #1a1a1a; background: white; outline: none; transition: border 0.15s; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #E8761A; }
  .field input[readonly] { background: #f8f6f3; color: #777; cursor: default; }
  .field textarea { resize: vertical; min-height: 82px; }
  .field .hint { font-size: 11px; color: #bbb; margin-top: 4px; }
  .divider { height: 1px; background: #f2ede8; margin: 16px 0; }

  /* ── Location type buttons ── */
  .loc-type-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .loc-type-btn { flex: 1; min-width: 70px; padding: 9px 6px; border: 1.5px solid #e8e8e8; border-radius: 10px; background: white; font-size: 13px; cursor: pointer; color: #666; transition: all 0.15s; text-align: center; font-family: inherit; font-weight: 500; }
  .loc-type-btn.active { background: #E8761A; color: white; border-color: #E8761A; }
  .loc-type-btn:hover:not(.active) { border-color: #E8761A; color: #E8761A; }

  /* ── Buttons ── */
  .btn-primary { width: 100%; padding: 13px; background: #E8761A; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; box-shadow: 0 4px 12px rgba(232,118,26,0.3); }
  .btn-primary:hover { background: #d06815; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

  /* ── Lock ── */
  .lock-overlay { display:flex; align-items:center; justify-content:center; min-height:260px; }
  .lock-box { background:white; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,0.1); padding:32px 28px; width:100%; max-width:320px; text-align:center; }
  .lock-icon { font-size:36px; margin-bottom:12px; }
  .lock-title { font-size:16px; font-weight:700; color:#1a1a1a; margin-bottom:6px; }
  .lock-sub { font-size:12px; color:#bbb; margin-bottom:18px; }
  .lock-input { width:100%; padding:11px 14px; border:1.5px solid #e8e8e8; border-radius:10px; font-size:18px; text-align:center; letter-spacing:0.2em; outline:none; color:#1a1a1a; font-family:inherit; }
  .lock-input:focus { border-color:#E8761A; }
  .lock-btn { width:100%; margin-top:12px; padding:12px; background:#E8761A; color:white; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(232,118,26,0.3); }
  .lock-btn:hover { background:#d06815; }
  .lock-err { font-size:12px; color:#e05252; margin-top:8px; min-height:18px; }

  /* ── Toast ── */
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:white; padding:11px 22px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:200; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
  .toast.show { opacity:1; }

  /* ── Filters ── */
  .filter-row { display:flex; gap:8px; margin-bottom:12px; }
  .filter-btn { flex:1; padding:9px 4px; border:1.5px solid #e8e8e8; border-radius:10px; background:white; font-size:13px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .filter-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .filter-btn:hover:not(.active) { border-color:#E8761A; color:#E8761A; }
  .dash-select { font-size:12px; padding:6px 10px; border:1.5px solid #e8e8e8; border-radius:8px; color:#444; background:white; outline:none; font-family:inherit; }
  .dash-select:focus { border-color:#E8761A; }

  /* ── Pagination ── */
  .pagination { display:flex; justify-content:center; align-items:center; gap:5px; margin-top:14px; flex-wrap:wrap; }
  .page-btn { padding:7px 12px; border:1.5px solid #e8e8e8; border-radius:8px; background:white; font-size:13px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; }
  .page-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .page-btn:hover:not(.active):not(:disabled) { border-color:#E8761A; color:#E8761A; }
  .page-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .page-ellipsis { font-size:13px; color:#bbb; padding:0 4px; }

  /* ── Case cards ── */
  .case-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:15px; margin-bottom:11px; }
  .case-card.is-closed { background:#f8f6f3; }
  .case-card.is-flagged { background:#f5f5f5; opacity:0.72; }
  .case-card.is-flagged .case-title,
  .case-card.is-flagged .case-desc { text-decoration:line-through; color:#bbb; }
  .case-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .case-id { font-size:11px; color:#bbb; font-weight:500; }
  .case-title { font-size:15px; font-weight:600; color:#1a1a1a; margin:3px 0 4px; }
  .case-meta { font-size:12px; color:#aaa; margin-bottom:9px; }
  .case-desc { font-size:13px; color:#555; background:#faf8f5; border-radius:8px; padding:9px 11px; margin-bottom:11px; border-left:3px solid #E8761A; }
  .badge { font-size:11px; padding:4px 11px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .badge.pending { background:#FEF0E3; color:#C05E0A; }
  .badge.done { background:#E6F4EA; color:#2D7A3E; }
  .badge.flagged { background:#f0f0f0; color:#999; }

  /* ── Mgr fields ── */
  .mgr-field { margin-bottom:10px; }
  .mgr-label { font-size:11px; color:#aaa; display:flex; align-items:center; gap:5px; margin-bottom:5px; font-weight:500; }
  .opt-tag { font-size:10px; color:#bbb; background:#f2f2f2; padding:1px 6px; border-radius:4px; }
  .tooltip-wrap { position:relative; display:inline-flex; }
  .tooltip-icon { font-size:12px; color:#ccc; cursor:default; }
  .tooltip-wrap:hover .tooltip-box { display:block; }
  .tooltip-box { display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#333; color:white; font-size:11px; padding:5px 9px; border-radius:6px; white-space:nowrap; z-index:10; pointer-events:none; }
  .mgr-field textarea, .mgr-field input[type=text] { width:100%; padding:8px 11px; border:1.5px solid #e8e8e8; border-radius:9px; font-size:13px; outline:none; font-family:inherit; color:#1a1a1a; background:white; }
  .mgr-field textarea { min-height:62px; resize:vertical; }
  .mgr-field textarea:focus, .mgr-field input[type=text]:focus { border-color:#E8761A; }

  /* ── Flag buttons ── */
  .flag-row { display:flex; gap:6px; flex-wrap:wrap; }
  .flag-btn { padding:5px 12px; border:1.5px solid #ccc; border-radius:20px; background:white; font-size:12px; cursor:pointer; color:#555; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .flag-btn.active-flag { background:#E8761A; color:white; border-color:#E8761A; font-weight:600; }
  .flag-btn:hover:not(.active-flag) { border-color:#E8761A; color:#E8761A; }

  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .btn-save { flex:1; padding:9px; background:#E8761A; color:white; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-save:hover { background:#d06815; }
  .btn-close-case { flex:1; padding:9px; background:#2D7A3E; color:white; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-close-case:hover { background:#246332; }
  .btn-reopen { flex:1; padding:9px; background:#f0f0f0; color:#666; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-reopen:hover { background:#e5e5e5; }

  /* ── Dashboard ── */
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:16px; text-align:center; }
  .stat-num { font-size:28px; font-weight:700; }
  .stat-num.orange { color:#E8761A; }
  .stat-num.green { color:#2D7A3E; }
  .stat-num.navy { color:#1a3a5c; }
  .stat-num.gray { color:#aaa; }
  .stat-label { font-size:12px; color:#bbb; margin-top:4px; font-weight:500; }
  .chart-wrap { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:18px; margin-bottom:14px; }
  .chart-title { font-size:13px; font-weight:700; margin-bottom:14px; color:#1a1a1a; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px; }
  .bar-label { width:54px; color:#666; text-align:right; flex-shrink:0; }
  .bar-track { flex:1; background:#f2ede8; border-radius:5px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:5px; transition:width 0.5s ease; min-width:4px; }
  .bar-val { width:28px; color:#444; font-weight:600; }

  /* ── Time filter ── */
  .time-filter-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .time-btn { padding:7px 13px; border:1.5px solid #e8e8e8; border-radius:20px; background:white; font-size:12px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .time-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .time-btn:hover:not(.active) { border-color:#E8761A; color:#E8761A; }
  .custom-range { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .custom-range input { padding:7px 10px; border:1.5px solid #e8e8e8; border-radius:9px; font-size:12px; color:#444; outline:none; font-family:inherit; }
  .custom-range input:focus { border-color:#E8761A; }
  .custom-range span { font-size:12px; color:#aaa; }

  /* ── Loc table ── */
  .loc-entry { margin-bottom:13px; padding-bottom:13px; border-bottom:1px solid #f2ede8; }
  .loc-entry:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .loc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .loc-name { font-size:13px; font-weight:600; color:#1a1a1a; }
  .loc-area-tag { font-size:11px; color:#bbb; margin-left:6px; }
  .loc-badges { display:flex; gap:5px; flex-shrink:0; }
  .lb-p { font-size:11px; padding:2px 8px; border-radius:20px; background:#FEF0E3; color:#C05E0A; font-weight:600; }
  .lb-d { font-size:11px; padding:2px 8px; border-radius:20px; background:#E6F4EA; color:#2D7A3E; font-weight:600; }

  /* ── Recent ── */
  .recent-item { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #f2ede8; font-size:13px; }
  .recent-item:last-child { border-bottom:none; }

  /* ── Public query ── */
  .pub-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:14px; margin-bottom:10px; }
  .pub-card.is-flagged { background:#f5f5f5; opacity:0.65; }
  .pub-card.is-flagged .pub-title,
  .pub-card.is-flagged .pub-desc { text-decoration:line-through; color:#bbb; }
  .pub-title { font-size:14px; font-weight:600; color:#1a1a1a; margin:3px 0 3px; }
  .pub-meta { font-size:12px; color:#bbb; margin-bottom:8px; }
  .pub-desc { font-size:13px; color:#666; background:#faf8f5; border-radius:8px; padding:8px 11px; border-left:3px solid #E8761A; }
  .pub-note { font-size:12px; color:#aaa; margin-top:7px; font-style:italic; }

  .empty-state { text-align:center; color:#ccc; padding:40px 0; font-size:14px; }
  #normPreview { display:none; margin-top:5px; font-size:12px; color:#E8761A; background:#FEF0E3; border-radius:7px; padding:5px 10px; }
  .dash-filter-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">🌟 渴望園區報修系統</div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchPage('form')">報修申請</div>
    <div class="nav-tab" onclick="switchPage('query')">案件查詢</div>
    <div class="nav-tab" onclick="requireAuth('mgr')">修繕管理</div>
    <div class="nav-tab" onclick="requireAuth('dash')">後台統計</div>
  </div>
  <div class="logout-btn" id="logoutBtn" style="display:none" onclick="logout()">登出</div>
</nav>

<!-- ── 密碼鎖 ── -->
<div id="page-lock" class="page" style="display:none;">
  <div class="lock-overlay">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">後台管理區</div>
      <div class="lock-sub">請輸入管理密碼才能進入</div>
      <input class="lock-input" type="password" id="pwInput" placeholder="••••••" maxlength="20"
        onkeydown="if(event.key==='Enter') checkPassword()" />
      <button class="lock-btn" onclick="checkPassword()">進入</button>
      <div class="lock-err" id="pwErr"></div>
    </div>
  </div>
</div>

<!-- ══ 報修表單 ══ -->
<div id="page-form" class="page active">
  <div class="card">
    <div class="card-header">🔧 設施報修申請</div>
    <div class="card-body">
      <div class="section-label">基本資料</div>
      <div class="field">
        <label>申請單位 *</label>
        <div class="loc-type-row" style="flex-wrap:wrap;" id="unit-btn-row">
          <button class="loc-type-btn" onclick="setUnit('房務部',this)">房務部</button>
          <button class="loc-type-btn" onclick="setUnit('客房部',this)">客房部</button>
          <button class="loc-type-btn" onclick="setUnit('休閒中心',this)">休閒中心</button>
          <button class="loc-type-btn" onclick="setUnit('饗渴望',this)">饗渴望</button>
          <button class="loc-type-btn" onclick="setUnit('會議組',this)">會議組</button>
          <button class="loc-type-btn" onclick="setUnit('其他',this)">其他</button>
        </div>
        <input type="text" id="f-unit" placeholder="請輸入單位名稱" style="display:none;margin-top:8px;" />
      </div>
      <div class="field"><label>申請人姓名 *</label><input type="text" id="f-name" placeholder="請輸入姓名" /></div>
      <div class="field"><label>報修日期</label><input type="text" id="f-date" readonly /></div>
      <div class="divider"></div>
      <div class="section-label">報修地點</div>
      <div class="field">
        <label>區域 *</label>
        <select id="f-area">
          <option value="">請選擇區域</option>
          <option value="會館">1. 會館</option>
          <option value="雅舍">2. 雅舍</option>
          <option value="研究園">3. 研究園</option>
          <option value="智尊">4. 智尊</option>
          <option value="其他">5. 其他</option>
        </select>
      </div>
      <div class="field">
        <label>位置類型 *</label>
        <div class="loc-type-row">
          <button class="loc-type-btn" onclick="setLocType('room',this)">🚪 客房</button>
          <button class="loc-type-btn" onclick="setLocType('restaurant',this)">🍽️ 餐廳</button>
          <button class="loc-type-btn" onclick="setLocType('facility',this)">🏛️ 設施</button>
          <button class="loc-type-btn" onclick="setLocType('other',this)">📍 公共區域／其他</button>
        </div>
        <div id="loc-input-wrap" style="display:none; margin-top:2px;">
          <input type="text" id="f-location" placeholder="" oninput="showNormPreview()" />
          <div class="hint" id="loc-hint"></div>
          <div id="normPreview">將儲存為：<span id="normValue"></span></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="section-label">故障情形</div>
      <div class="field">
        <label>故障狀況描述 *</label>
        <textarea id="f-desc" placeholder="請詳細描述故障狀況…"></textarea>
      </div>
      <button class="btn-primary" id="submitBtn" onclick="submitForm()">送出報修申請</button>
    </div>
  </div>
</div>

<!-- ══ 案件查詢（公開）══ -->
<div id="page-query" class="page">
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterQuery('待處理',this)">待處理</button>
    <button class="filter-btn" onclick="filterQuery('已結案',this)">已結案</button>
  </div>
  <div class="filter-row" style="flex-wrap:wrap;gap:6px;" id="query-area-row">
    <button class="filter-btn active" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('all',this)">全部</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('會館',this)">會館</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('雅舍',this)">雅舍</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('研究園',this)">研究園</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('智尊',this)">智尊</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterQueryArea('其他',this)">其他</button>
  </div>
  <div id="queryList"><div class="empty-state">載入中…</div></div>
  <div id="queryPagination" class="pagination"></div>
</div>

<!-- ══ 修繕管理 ══ -->
<div id="page-mgr" class="page">
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterCases('待處理',this)">待處理</button>
    <button class="filter-btn" onclick="filterCases('已結案',this)">已結案</button>
  </div>
  <div class="filter-row" style="flex-wrap:wrap;gap:6px;" id="mgr-area-row">
    <button class="filter-btn active" style="flex:none;padding:7px 12px;" onclick="filterMgrArea('all',this)">全部</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterMgrArea('會館',this)">會館</button>
    <button class="filter-btn" style="flex:none;padding:7px 12px;" onclick="filterMgrArea('雅舍',this)">雅舍</button>

let allCases = [];

const AREA_COLORS = { '會館':'#E8761A', '雅舍':'#1a3a5c', '研究園':'#2D7A3E', '智尊':'#8B5CF6', '其他':'#aaa' };

function setLocType(type, btn) {

  else { input.placeholder='例：廁所、走廊、停車場、小熊廣場…'; hint.textContent=''; }

// ── 位置標準化 ──
function normalizeLocation(raw) {
  if (!raw) return '';
  raw = String(raw);
  if (!raw.trim()) return '';
  let s = raw.trim();
  s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const cnMap = {'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  s = s.replace(/[一二三四五六七八九零十百]+/g, m => {
    let n = 0;
    if (m.includes('十')) {
      const parts = m.split('十');
      const left = parts[0] ? parts[0].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 1;
      const right = parts[1] ? parts[1].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 0;
      n = left*10 + right;
    } else {
      n = m.split('').reduce((a,c)=>a*10+(cnMap[c]??0),0);
    }
    return n>0 ? String(n) : m;
  });
  s = s.replace(/(\d+)\s*[樓层F]/g, '$1F');
  s = s.replace(/走道|廊道|通道/g, '走廊');
  s = s.replace(/厅/g, '廳');
  s = s.replace(/(\d+)\s*[號号]\s*[房室間]?/g, '$1');
  s = s.replace(/(\d+)\s*[室房間]/g, '$1');
  s = s.replace(/[、，,。.]\s*$/, '');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function showNormPreview() {
  const raw = document.getElementById('f-location').value;
  const norm = normalizeLocation(raw);
  const preview = document.getElementById('normPreview');
  if (norm && norm !== raw.trim()) {
    document.getElementById('normValue').textContent = norm;
    preview.style.display = 'block';
  } else { preview.style.display = 'none'; }
}

}

  document.getElementById('pwInput').value='';
  document.getElementById('pwErr').textContent='';
  setTimeout(()=>document.getElementById('pwInput').focus(),100);
}
function checkPassword() {
  const pw = document.getElementById('pwInput').value;
  if (pw===ADMIN_PASSWORD) {
    sessionStorage.setItem('adminAuth','yes');

function switchPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-lock').style.display='none';
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const idx = ['form','query','mgr','dash'].indexOf(id);
  if (idx>=0) document.querySelectorAll('.nav-tab')[idx].classList.add('active');
  if (['mgr','dash','query'].includes(id)) loadCases();
}

// ── 送出報修 ──
async function submitForm() {
  const unit = document.getElementById('f-unit').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const area = document.getElementById('f-area').value;
  const desc = document.getElementById('f-desc').value.trim();
  if (!unit) { showToast('請選擇申請單位'); return; }
  if (!name||!area||!desc||!locType) { showToast('請填寫所有必填欄位（*）'); return; }
  const now = new Date();
  const datetime = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='送出中…';
  try {
    const locTypeLabel = {room:'客房',restaurant:'餐廳',facility:'設施',other:'公共區域／其他'}[locType]||'';
    const location = normalizeLocation(document.getElementById('f-location').value.trim());
    const params = new URLSearchParams({ action:'submit', unit, name, datetime, area, locationType:locTypeLabel, location, description:desc });
    const res = await fetch(API_URL+'?'+params);
    const data = await res.json();
    if (data.success) {
      showToast('✓ '+data.message);
      ['f-unit','f-name','f-area','f-location','f-desc'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('loc-input-wrap').style.display='none';
      document.getElementById('normPreview').style.display='none';
      document.querySelectorAll('.loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('f-unit').style.display='none';
      locType='';
    } else { showToast('錯誤：'+data.message); }
  } catch(e) { showToast('連線失敗，請檢查網路'); }
  btn.disabled=false; btn.textContent='送出報修申請';
}

// ── 載入案件 ──
async function loadCases() {
  try {
    const res = await fetch(API_URL+'?action=getAll');
    const data = await res.json();
    if (data.success) {
      allCases = data.cases.reverse();
      renderCases(); renderQuery(); renderDashboard();
    }
  } catch(e) {
    document.getElementById('caseList').innerHTML='<div class="empty-state">載入失敗，請檢查連線</div>';
  }
}

function filterMgrArea(area, btn) {
  currentMgrArea = area;

  document.querySelectorAll('#mgr-area-row .filter-btn').forEach(b=>b.classList.remove('active'));

function filterCases(status, btn) {
  currentFilter=status; mgrPage=1;
  document.querySelectorAll('#page-mgr .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderCases();
}

function renderCases() {
  const list = document.getElementById('caseList');
  let filtered = allCases.filter(c=>c.status===currentFilter);
  if (currentMgrArea!=='all') filtered=filtered.filter(c=>c.area===currentMgrArea);
  if (!filtered.length) { list.innerHTML='<div class="empty-state">目前沒有案件</div>'; document.getElementById('mgrPagination').innerHTML=''; return; }
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if (mgrPage>totalPages) mgrPage=totalPages;
  const paged = filtered.slice((mgrPage-1)*PAGE_SIZE, mgrPage*PAGE_SIZE);

  list.innerHTML = paged.map(c => {
    const isFlagged = !!c.flagReason;
    const cls = isFlagged ? 'case-card is-flagged' : currentFilter==='已結案' ? 'case-card is-closed' : 'case-card';
    const locDisplay = c.normalizedLocation || c.location || '—';
    return `<div class="${cls}">
      <div class="case-top">
        <div>
          <div class="case-id">${c.caseId} · ${formatDatetime(c.datetime||c.date)}</div>
          <div class="case-title">${c.area} · ${locDisplay}${c.locationType ? ' <span style="font-size:11px;background:#FEF0E3;color:#C05E0A;padding:2px 8px;border-radius:20px;font-weight:600;">'+c.locationType+'</span>' : ''}</div>
          <div class="case-meta">${c.unit} · ${c.name}</div>
        </div>
        <span class="badge ${isFlagged?'flagged':c.status==='待處理'?'pending':'done'}">${isFlagged?'已標記':c.status}</span>
      </div>
      <div class="case-desc">${c.description}</div>
      <div class="mgr-field">
        <div class="mgr-label">案件類型 <span style="font-size:10px;color:#e05252;background:#fdecea;padding:1px 6px;border-radius:4px;">必填</span></div>
        <div class="flag-row" id="ctype-${c.rowIndex}">
          ${['空調','電力','給排水','建物','電梯','其他'].map(f=>`<button class="flag-btn${c.caseType&&c.caseType.startsWith(f)?' active-flag':''}" onclick="toggleCaseType(${c.rowIndex},'${f}',this)">${f}</button>`).join('')}
        </div>
        <input type="text" id="ctype-other-${c.rowIndex}" placeholder="請描述類型（選填）"
          style="display:${c.caseType&&c.caseType.startsWith('其他')&&c.caseType.length>2?'block':'none'};margin-top:6px;width:100%;padding:7px 11px;border:1.5px solid #e8e8e8;border-radius:9px;font-size:13px;font-family:inherit;outline:none;"
          value="${c.caseType&&c.caseType.startsWith('其他')?c.caseType.replace('其他：',''):''}">
      </div>
      <div class="mgr-field">
        <div class="mgr-label">更正位置類型 <span class="opt-tag">選填</span></div>
        <div class="flag-row" id="ltype-${c.rowIndex}">
          ${['客房','餐廳','設施','公共區域／其他'].map(f=>`<button class="flag-btn${(c.correctedLocType||c.locationType)===f?' active-flag':''}" onclick="toggleLocType(${c.rowIndex},'${f}',this)">${f}</button>`).join('')}
        </div>
      </div>
      <div class="mgr-field">
        <div class="mgr-label">
          標準化位置 <span class="opt-tag">選填</span>
          <span class="tooltip-wrap"><span class="tooltip-icon">ⓘ</span><span class="tooltip-box">填入後病歷表將優先以此統計，可隨時修改</span></span>
        </div>
        <input type="text" id="norm-${c.rowIndex}" value="${c.normalizedLocation||''}" placeholder="例：3F走廊、502（統一名稱）" />
      </div>
      <div class="mgr-field">
        <div class="mgr-label">維修記錄</div>
        <textarea id="note-${c.rowIndex}" placeholder="填寫處理情形…">${c.repairNote||''}</textarea>
      </div>
      <div class="mgr-field">
        <div class="mgr-label">標記原因 <span class="opt-tag">選填，標記後不列入病歷表統計</span></div>
        <div class="flag-row" id="flags-${c.rowIndex}">
          ${['寫錯','重複報修','測試'].map(f=>`<button class="flag-btn${c.flagReason===f?' active-flag':''}" onclick="toggleFlag(${c.rowIndex},'${f}',this)">${f}</button>`).join('')}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-save" onclick="updateCase(${c.rowIndex})">儲存</button>
        ${c.status==='待處理'
          ? `<button class="btn-close-case" onclick="closeCase(${c.rowIndex})">結案</button>`
          : `<button class="btn-reopen" onclick="reopenCase(${c.rowIndex})">取消結案</button>`}
      </div>
    </div>`;
  }).join('');

  renderPagination('mgrPagination', mgrPage, totalPages, p=>{mgrPage=p;renderCases();});
}

function toggleLocType(rowIndex, type, btn) {
  const btns = document.getElementById('ltype-'+rowIndex).querySelectorAll('.flag-btn');
  const wasActive = btn.classList.contains('active-flag');
  btns.forEach(b=>b.classList.remove('active-flag'));
  if (!wasActive) btn.classList.add('active-flag');
}

function getSelectedLocType(rowIndex) {
  const el = document.getElementById('ltype-'+rowIndex);
  if (!el) return '';
  const active = el.querySelector('.active-flag');
  return active ? active.textContent : '';
}

function toggleCaseType(rowIndex, type, btn) {
  const btns = document.getElementById('ctype-'+rowIndex).querySelectorAll('.flag-btn');
  btns.forEach(b=>b.classList.remove('active-flag'));
  btn.classList.add('active-flag');
  const otherInput = document.getElementById('ctype-other-'+rowIndex);
  if (otherInput) otherInput.style.display = type==='其他' ? 'block' : 'none';
}

function getSelectedCaseType(rowIndex) {
  const el = document.getElementById('ctype-'+rowIndex);
  if (!el) return '';
  const active = el.querySelector('.active-flag');
  if (!active) return '';
  const type = active.textContent;
  if (type === '其他') {
    const otherInput = document.getElementById('ctype-other-'+rowIndex);
    const otherVal = otherInput ? otherInput.value.trim() : '';
    return otherVal ? '其他：' + otherVal : '其他';
  }
  return type;
}

function toggleFlag(rowIndex, reason, btn) {
  const btns = document.getElementById('flags-'+rowIndex).querySelectorAll('.flag-btn');
  const wasActive = btn.classList.contains('active-flag');
  btns.forEach(b=>b.classList.remove('active-flag'));
  if (!wasActive) btn.classList.add('active-flag');
}

function getSelectedFlag(rowIndex) {
  const el = document.getElementById('flags-'+rowIndex);
  if (!el) return '';
  const active = el.querySelector('.active-flag');
  return active ? active.textContent : '';
}

async function updateCase(rowIndex) {
  const note = document.getElementById('note-'+rowIndex).value;
  const norm = document.getElementById('norm-'+rowIndex).value;
  const flag = getSelectedFlag(rowIndex);
  const caseType = getSelectedCaseType(rowIndex);
  if (!caseType) { showToast('請選擇案件類型'); return; }
  const correctedLocType = getSelectedLocType(rowIndex);
  await callApi({action:'update', rowIndex, repairNote:note, normalizedLocation:norm, flagReason:flag, caseType, correctedLocType});
  showToast('✓ 已儲存'); loadCases();
}
async function closeCase(rowIndex) {
  const note = document.getElementById('note-'+rowIndex).value;
  const norm = document.getElementById('norm-'+rowIndex).value;
  const flag = getSelectedFlag(rowIndex);
  const caseType = getSelectedCaseType(rowIndex);
  if (!caseType) { showToast('請選擇案件類型'); return; }
  const correctedLocType = getSelectedLocType(rowIndex);
  await callApi({action:'close', rowIndex, repairNote:note, normalizedLocation:norm, flagReason:flag, caseType, correctedLocType});
  showToast('✓ 案件已結案'); loadCases();
}
async function reopenCase(rowIndex) {
  await callApi({action:'reopen', rowIndex});
  showToast('✓ 已取消結案'); loadCases();
}
async function callApi(params) {
  const res = await fetch(API_URL+'?'+new URLSearchParams(params));
  return res.json();
}

function filterQueryArea(area, btn) {
  currentQueryArea = area;
  queryPage = 1;

  btn.classList.add('active');

  currentQueryFilter=status; queryPage=1;
  document.querySelectorAll('#page-query .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderQuery();
}

function renderQuery() {
  const list = document.getElementById('queryList');
  let filtered = allCases;
  if (currentQueryFilter!=='all') filtered=filtered.filter(c=>c.status===currentQueryFilter);
  if (currentQueryArea!=='all') filtered=filtered.filter(c=>c.area===currentQueryArea);

  if (!filtered.length) { list.innerHTML='<div class="empty-state">目前沒有案件</div>'; document.getElementById('queryPagination').innerHTML=''; return; }
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if (queryPage>totalPages) queryPage=totalPages;
  const paged = filtered.slice((queryPage-1)*PAGE_SIZE, queryPage*PAGE_SIZE);
  list.innerHTML = paged.map(c => {
    const isFlagged = !!c.flagReason;
    const locDisplay = c.normalizedLocation||c.location||'—';
    return `<div class="pub-card${isFlagged?' is-flagged':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="case-id">${c.caseId} · ${formatDatetime(c.datetime||c.date)}</div>
          <div class="pub-title">${c.area} · ${locDisplay}${c.locationType ? ' <span style="font-size:11px;background:#FEF0E3;color:#C05E0A;padding:2px 8px;border-radius:20px;font-weight:600;">'+c.locationType+'</span>' : ''}</div>
          <div class="pub-meta">${c.unit} · ${c.name}</div>
        </div>
        <span class="badge ${isFlagged?'flagged':c.status==='待處理'?'pending':'done'}">${isFlagged?'已標記':c.status}</span>
      </div>
      <div class="pub-desc">${c.description}</div>
      ${c.repairNote?`<div class="pub-note">📋 維修記錄：${c.repairNote}</div>`:''}
    </div>`;
  }).join('');
  renderPagination('queryPagination', queryPage, totalPages, p=>{queryPage=p;renderQuery();});
}

// ── 分頁 ──
function renderPagination(containerId, current, total, onChange) {
  const el = document.getElementById(containerId);
  if (total<=1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" ${current===1?'disabled':''} onclick="(${onChange.toString()})(${current-1})">‹</button>`;
  for (let i=1; i<=total; i++) {
    if (total>7 && i>2 && i<total-1 && Math.abs(i-current)>1) {
      if (i===3||i===total-2) html+=`<span class="page-ellipsis">…</span>`;
      continue;
    }
    html+=`<button class="page-btn${i===current?' active':''}" onclick="(${onChange.toString()})(${i})">${i}</button>`;
  }
  html+=`<button class="page-btn" ${current===total?'disabled':''} onclick="(${onChange.toString()})(${current+1})">›</button>`;
  el.innerHTML=html;
}

// ── 時間篩選 ──
function setAreaDashFilter(area, btn) {
  currentAreaDashFilter = area;
  document.querySelectorAll('.time-filter-row:nth-child(2) .time-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDashboard();
}

function setTimeFilter(type, btn) {
  currentTimeFilter=type;
  document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customRangeWrap').style.display = type==='custom'?'flex':'none';
  renderDashboard();
}

function formatDatetime(raw) {
  if (!raw) return '';
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // Try to parse
  const m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
    const day = weekdays[d.getDay()];
    return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')} ${day}`;
  }
  // GMT string fallback
  const d = new Date(raw);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const day = weekdays[d.getDay()];
    return `${y}/${mo}/${dd} ${day}`;
  }
  return raw;
}

function parseDate(raw) {
  if (!raw) return null;
  const m1 = String(raw).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (m1) return new Date(parseInt(m1[1]), parseInt(m1[2])-1, parseInt(m1[3]));
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

function getFilteredCases() {
  const now = new Date();
  let valid = allCases.filter(c=>!c.flagReason);
  if (currentAreaDashFilter!=='all') valid = valid.filter(c=>c.area===currentAreaDashFilter);
  if (currentTimeFilter==='all') return valid;
  return valid.filter(c=>{
    const raw = c.datetime||c.date||'';
    const d = parseDate(raw);
    if (!d) return true;
    if (currentTimeFilter==='month') return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
    if (currentTimeFilter==='3month') return (now-d)<=90*24*60*60*1000;
    if (currentTimeFilter==='year') return d.getFullYear()===now.getFullYear();
    if (currentTimeFilter==='custom') {
      const from=document.getElementById('dateFrom').value;
      const to=document.getElementById('dateTo').value;
      if (from&&d<new Date(from)) return false;
      if (to&&d>new Date(to+'T23:59:59')) return false;
      return true;
    }
    return true;
  });
}

// ── 後台統計 ──
function renderDashboard() {
  const cases = getFilteredCases();
  const total=cases.length, pending=cases.filter(c=>c.status==='待處理').length, done=cases.filter(c=>c.status==='已結案').length;
  document.getElementById('d-total').textContent=total;
  document.getElementById('d-pending').textContent=pending;
  document.getElementById('d-done').textContent=done;
  document.getElementById('d-rate').textContent=total>0?Math.round(done/total*100)+'%':'—';

  const areaCounts={};
  cases.forEach(c=>{areaCounts[c.area]=(areaCounts[c.area]||0)+1;});
  const maxC=Math.max(...Object.values(areaCounts),1);
  document.getElementById('areaChart').innerHTML=Object.entries(areaCounts).sort((a,b)=>b[1]-a[1]).map(([area,count])=>`
    <div class="bar-row">
      <div class="bar-label">${area}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxC*100)}%;background:${AREA_COLORS[area]||'#aaa'};"></div></div>
      <div class="bar-val">${count}</div>
    </div>`).join('')||'<div class="empty-state" style="padding:20px 0;">暫無資料</div>';

  const areaF=currentAreaDashFilter;
  const locCases=areaF==='all'?cases:cases.filter(c=>c.area===areaF);
  const locMap={};
  locCases.forEach(c=>{
    const loc=c.normalizedLocation||normalizeLocation(c.location)||'（未填位置）';
    const key=c.area+'|'+loc;
    if(!locMap[key]) locMap[key]={area:c.area,loc,total:0,pending:0,done:0,cases:[]};
    locMap[key].total++; if(c.status==='待處理') locMap[key].pending++; else locMap[key].done++;
    locMap[key].cases.push(c);
  });
  const locEntries=Object.values(locMap).sort((a,b)=>b.total-a.total);
  const maxL=Math.max(...locEntries.map(e=>e.total),1);
  document.getElementById('locationTable').innerHTML=locEntries.length?locEntries.map((e,i)=>{
    const entryId='loc-detail-'+i;
    const caseRows=e.cases.map(c=>`
      <div style="padding:8px 10px;border-bottom:1px solid #f5f0eb;last-child:border-none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
          <div style="font-size:11px;color:#bbb;">${c.caseId} · ${c.datetime||c.date}</div>
          <span class="badge ${c.status==='待處理'?'pending':'done'}" style="font-size:10px;padding:2px 8px;">${c.status}</span>
        </div>
        <div style="font-size:13px;color:#333;margin-bottom:4px;">${c.description}</div>
        ${c.repairNote?`<div style="font-size:12px;color:#888;font-style:italic;">📋 ${c.status==='已結案'?'結案紀錄':'處理進度'}：${c.repairNote}</div>`:`<div style="font-size:12px;color:#ccc;font-style:italic;">${c.status==='待處理'?'處理進度：（尚未填寫）':''}</div>`}
      </div>`).join('');
    return `
    <div class="loc-entry">
      <div class="loc-top" onclick="toggleLocDetail('${entryId}')" style="cursor:pointer;">
        <div><span style="font-size:11px;font-weight:700;color:#ddd;margin-right:6px;">#${i+1}</span><span class="loc-name">${e.loc}</span>${areaF==='all'?`<span class="loc-area-tag">${e.area}</span>`:''}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="loc-badges">${e.pending?`<span class="lb-p">${e.pending} 待處理</span>`:''}${e.done?`<span class="lb-d">${e.done} 已結案</span>`:''}</div>
          <span id="arrow-${entryId}" style="font-size:12px;color:#ccc;transition:transform 0.2s;">▼</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:5px;">
        <div style="flex:1;background:#f2ede8;border-radius:5px;height:10px;overflow:hidden;"><div style="height:100%;border-radius:5px;background:${AREA_COLORS[e.area]||'#aaa'};width:${Math.round(e.total/maxL*100)}%;"></div></div>
        <span style="font-size:12px;font-weight:600;color:#444;min-width:30px;text-align:right;">${e.total} 次</span>
      </div>
      <div id="${entryId}" style="display:none;margin-top:10px;background:#faf8f5;border-radius:8px;overflow:hidden;border:1px solid #f0ebe4;">
        ${caseRows}
      </div>
    </div>`;
  }).join(''):'<div class="empty-state" style="padding:20px 0;">暫無資料</div>';

  const locTypeColors = {'客房':'#E8761A','餐廳':'#3B82F6','設施':'#8B5CF6','公共區域／其他':'#aaa'};
  const locTypeCounts = {};
  cases.forEach(c=>{
    const lt = c.correctedLocType || c.locationType || '';
    if (lt) locTypeCounts[lt]=(locTypeCounts[lt]||0)+1;
  });
  const maxLT = Math.max(...Object.values(locTypeCounts),1);
  document.getElementById('locTypeChart').innerHTML = Object.keys(locTypeCounts).length ?
    Object.entries(locTypeCounts).sort((a,b)=>b[1]-a[1]).map(([type,count])=>`
      <div class="bar-row">
        <div class="bar-label" style="width:80px;">${type}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxLT*100)}%;background:${locTypeColors[type]||'#aaa'};"></div></div>
        <div class="bar-val">${count}</div>
      </div>`).join('') : '<div class="empty-state" style="padding:20px 0;">暫無資料</div>';

  const typeColors = {'空調':'#3B82F6','電力':'#F59E0B','給排水':'#06B6D4','建物':'#10B981','電梯':'#8B5CF6','其他':'#aaa'};
  const typeCounts = {};
  cases.forEach(c=>{ if(c.caseType) typeCounts[c.caseType]=(typeCounts[c.caseType]||0)+1; });
  const maxT = Math.max(...Object.values(typeCounts),1);
  document.getElementById('caseTypeChart').innerHTML = Object.keys(typeCounts).length ? 
    Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([type,count])=>`
      <div class="bar-row">
        <div class="bar-label">${type}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxT*100)}%;background:${typeColors[type]||'#aaa'};"></div></div>
        <div class="bar-val">${count}</div>
      </div>`).join('') : '<div class="empty-state" style="padding:20px 0;">尚未填寫案件類型</div>';

  document.getElementById('recentList').innerHTML=cases.slice(0,8).map(c=>`
    <div class="recent-item">
      <div>
        <div style="font-weight:600;color:#1a1a1a;">${c.area} · ${c.normalizedLocation||normalizeLocation(c.location)||'—'}</div>
        <div style="font-size:11px;color:#bbb;margin-top:2px;">${c.unit} · ${formatDatetime(c.datetime||c.date)}</div>
      </div>
      <span class="badge ${c.status==='待處理'?'pending':'done'}">${c.status}</span>
    </div>`).join('')||'<div class="empty-state">暫無資料</div>';
}

function toggleLocDetail(id) {
  const el = document.getElementById(id);
  const arrow = document.getElementById('arrow-'+id);
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'block';
  arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
}

async function enableNotifications() {
  if (!('Notification' in window)) { showToast('此瀏覽器不支援通知'); return; }
  if (Notification.permission === 'granted') { showToast('通知已開啟！'); return; }
  const permission = await Notification.requestPermission();
  if (permission === 'granted') {
    try {
      const messaging = window._fcmMessaging;
      const reg = window._fcmReg;
      if (messaging && reg) {
        const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        if (token) {
          fetch(API_URL + '?action=saveToken&token=' + encodeURIComponent(token));
          showToast('✓ 推播通知已開啟！');
          document.getElementById('notifyBtn').style.display = 'none';
          document.getElementById('notifyBtn').style.display = 'none';
        }
      }
    } catch(e) { showToast('通知設定失敗：' + e.message); }
  } else {
    showToast('通知權限被拒絕，請至瀏覽器設定開啟');
  }
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
